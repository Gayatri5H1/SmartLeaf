<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
</head>
<body>

<h1>🌿 Results</h1>

{% for result in results %}

    <h2>{{ result.disease }}</h2>
    <p>Confidence: {{ result.confidence }}%</p>
    <p>Severity: {{ result.severity }}</p>
    <p>Urgency: {{ result.urgency }}</p>

    <h3>Chemical</h3>
    <p>{{ result.chemical }}</p>

    <h3>Organic</h3>
    <p>{{ result.organic }}</p>

    <h3>Prevention</h3>
    <p>{{ result.prevention }}</p>

    <hr>

{% endfor %}

</body>
</html>
