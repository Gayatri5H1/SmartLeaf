{% extends "base.html" %}
{% block content %}

<div class="explain-container">

    <h1>🧠 Explainable AI Insights</h1>

    {% for r in results %}
    <div class="explain-card">

        <!-- HEADER -->
        <div class="header">
            <h2>{{ r.image }}</h2>
            <span class="badge {{ r.severity|lower }}">{{ r.severity }}</span>
        </div>

        <!-- INFO -->
        <div class="info">
            <p><strong>Crop:</strong> {{ r.crop }}</p>
            <p><strong>Disease:</strong> {{ r.disease }}</p>
        </div>

        <!-- IMAGE COMPARISON -->
        <div class="image-grid">

            <div class="image-box">
                <h4>Original Image</h4>
                <img src="{{ url_for('static', filename=r.image_path) }}">
            </div>

            <div class="image-box">
                <h4>Grad-CAM Heatmap</h4>
                <img src="{{ url_for('static', filename=r.gradcam) }}">
            </div>

        </div>

        <!-- EXPLANATION -->
        <div class="explanation">
            <h4>🔍 Model Explanation</h4>
            <p>{{ r.explanation }}</p>
        </div>

    </div>
    {% endfor %}

</div>

{% endblock %}
